<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="280" height="56" viewBox="0 0 280 56">
  <defs>
    <linearGradient id="lpGrad" x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="lpGlow" x="-40%" y="-40%"
            width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rocket icon -->
  <g filter="url(#lpGlow)">
    <!-- Body -->
    <path d="M28,6 C28,6 38,10 42,22
             L42,38 L28,48 L14,38
             L14,22 C18,10 28,6 28,6 Z"
          fill="url(#lpGrad)"/>
    <!-- Window -->
    <circle cx="28" cy="22" r="5"
            fill="#0c0a14" opacity="0.45"/>
    <!-- Left fin -->
    <path d="M14,32 L8,42 L16,38 Z"
          fill="url(#lpGrad)" opacity="0.8"/>
    <!-- Right fin -->
    <path d="M42,32 L48,42 L40,38 Z"
          fill="url(#lpGrad)" opacity="0.8"/>
    <!-- Flame -->
    <path d="M24,44 Q28,52 32,44"
          stroke="#fbbf24" stroke-width="2.5"
          fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text font-family="-apple-system, BlinkMacSystemFont,
        'Segoe UI', Inter, sans-serif"
        font-size="26" letter-spacing="-0.02em"
        y="37" x="60">
    <tspan font-weight="800"
           fill="#ffffff">Launch</tspan><tspan
           font-weight="500" fill="#c4b5fd"
           dx="4">Pad</tspan>
  </text>
</svg>
