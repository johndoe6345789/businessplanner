      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-platform (private internal service) ----
  businessplanner-platform:
    image: localhost:5001/johndoe6345789/businessplanner/businessplanner-platform:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
