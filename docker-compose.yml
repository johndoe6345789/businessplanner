      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
      ES_HOST: elasticsearch
      ES_PORT: "9200"
