## LaunchPad — LEAN Docker Compose (right-sized for a 3.8 GB host).
##
## Lean-ship changes vs docker-compose.yml.prelean:
##  - backend + backend-migrate use the registry:2 businessplanner-api image,
##    kept CURRENT by the businessplanner-apps Jenkins pipeline (which
##    reuses the prebuilt businessplanner-base-conan layer — no host C++ compile).
##  - Elasticsearch COMMENTED OUT "for now" (user instruction + JVM mem
##    hog). Full-text search disabled until re-enabled.
##  - Keycloak + keycloak-db KEPT (required for login/OIDC) but the JVM
##    heap is tightly capped (Java is a mem hog on this 3.8 GB host).
##  - Every service has a hard `mem_limit` (contains each container so a
##    spike cannot OOM-cascade the other resident stacks).
##  - Postgres shared_buffers 24MB, Redis maxmemory 48MB, Next heap 512MB.
##  - Only the nginx `portal` publishes a host port (8892).
##
## Usage:
##   docker compose up -d --build
## App: http://localhost:8892/app/en

services:

  # ---- PostgreSQL (main app) --------------------------------
  db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=24MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
    environment:
      POSTGRES_DB: businessplanner_db
      POSTGRES_USER: businessplanner
      POSTGRES_PASSWORD: businessplanner_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessplanner -d businessplanner_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    restart: unless-stopped

  # ---- Keycloak Postgres ------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 140m
    restart: unless-stopped

  # ---- Keycloak (OIDC identity provider) --------------------
  # REQUIRED for login. JVM/Quarkus — tightly heap-capped (Java is a
  # mem hog on a 3.8 GB host); revisit caps after the 16 GB upgrade.
  keycloak:
    build:
      context: ./docker/keycloak
      dockerfile: Dockerfile
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8892/sso
      KC_HTTP_RELATIVE_PATH: /sso
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS_KC_HEAP: "-Xms48m -Xmx256m"
      KC_GITHUB_CLIENT_ID: ${KC_GITHUB_CLIENT_ID:-}
      KC_GITHUB_CLIENT_SECRET: ${KC_GITHUB_CLIENT_SECRET:-}
      KC_GOOGLE_CLIENT_ID: ${KC_GOOGLE_CLIENT_ID:-}
      KC_GOOGLE_CLIENT_SECRET: ${KC_GOOGLE_CLIENT_SECRET:-}
      KC_MICROSOFT_CLIENT_ID: ${KC_MICROSOFT_CLIENT_ID:-}
      KC_MICROSOFT_CLIENT_SECRET: ${KC_MICROSOFT_CLIENT_SECRET:-}
    mem_limit: 420m
    restart: unless-stopped

  # ---- Elasticsearch MOCK (hacky C++; no JVM) --------------
  # Replaces the ~1 GB ES JVM (Java is a mem hog on this 3.8 GB
  # host). Backend's ES client is unchanged — it "thinks it's
  # talking to ES, but it's mocked": indexing is acknowledged,
  # every search returns zero hits. Swap back to
  # image: elasticsearch:8.17.0 after the 16 GB upgrade.
  elasticsearch:
    build:
      context: ./docker/es-mock
      dockerfile: Dockerfile
    mem_limit: 32m
    restart: unless-stopped

  # ---- Redis (sessions + rate-limiting) ---------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 90m
    restart: unless-stopped

  # ---- DB migrations (runs once, then exits) ----------------
  # Uses the registry:2 businessplanner-api image kept CURRENT by the
  # businessplanner-apps Jenkins pipeline (migrate fix af658ca + the
  # baked migration SQL come from that fresh image — no host compile).
  # Dedicated one-shot migrator (replaces the monolith
  # businessplanner-api migrate sidecar). Its entrypoint runs
  # `migrate --up` against the baked config/config.json
  # then exits — no command/env override needed.
  businessplanner-migrate:
    image: localhost:5001/johndoe6345789/businessplanner/businessplanner-migrate:latest
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  # ---- businessplanner-auth microservice (Phase 5 vertical slice) ----
  # Per-service image (BP slug). Proves the split end-to-end;
  # owns auth/users/api-keys/user-preferences routes (nginx
  # prefix routing wired during Phase 6 fan-out).
  businessplanner-auth:
    image: localhost:5001/johndoe6345789/businessplanner/businessplanner-auth:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      JWT_SECRET: change-me-in-production
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-social (private internal service) ----
  businessplanner-social:
    image: localhost:5001/johndoe6345789/businessplanner/businessplanner-social:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
