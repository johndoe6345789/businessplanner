      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
    mem_limit: 96m
    restart: unless-stopped

  # ---- Next.js frontend -------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      additional_contexts:
        shared: ./shared
      args:
        SRC_BUST: ${SRC_BUST:-0}
    depends_on:
      - businessplanner-platform
    environment:
      NEXT_PUBLIC_BASE_PATH: /app
      INTERNAL_API_URL: http://businessplanner-platform:9012
      NEXT_BASE_PATH: /app
      BACKEND_URL: http://businessplanner-platform:9012
      NODE_OPTIONS: "--max-old-space-size=512"
    mem_limit: 700m
    restart: unless-stopped

  # ---- SSO portal (login gate) ------------------------------
  sso:
    build:
      context: ./services/sso/portal
      dockerfile: Dockerfile
      args:
        SRC_BUST: ${SRC_BUST:-0}
    volumes:
      - sso_node_modules:/build/sso/node_modules
      - sso_next:/build/sso/.next
    depends_on:
      - businessplanner-platform
    environment:
      NEXT_PUBLIC_ORIGIN: http://localhost:8892
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=512"
    mem_limit: 700m
    restart: unless-stopped

  # ---- Package repository — dedicated Postgres --------------
  pkgrepo-db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
    environment:
      POSTGRES_DB: pkgrepo_db
      POSTGRES_USER: pkgrepo
      POSTGRES_PASSWORD: pkgrepo_dev
    volumes:
      - pkgrepo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U pkgrepo -d pkgrepo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 140m
    restart: unless-stopped

  # ---- MinIO (S3-compatible blob store) ---------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f",
             "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  # ---- MinIO bucket init (runs once, then exits) ------------
  pkgrepo-mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local
        http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/packagerepo
    mem_limit: 64m
    restart: "no"

  # ---- Package repository — C++ backend ---------------------
  pkgrepo-backend:
    build:
      context: ./services/package-repository/root
      dockerfile: backend/Dockerfile
    depends_on:
      pkgrepo-db:
        condition: service_healthy
      pkgrepo-mc:
        condition: service_completed_successfully
    environment:
      PGHOST: pkgrepo-db
      PGPORT: "5432"
      PGUSER: pkgrepo
      PGPASSWORD: pkgrepo_dev
      PGDATABASE: pkgrepo_db
      DATABASE_URL: >-
        host=pkgrepo-db port=5432
        dbname=pkgrepo_db
        user=pkgrepo password=pkgrepo_dev
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: packagerepo
      S3_ACCESS_KEY: minioadmin
      JWT_SECRET: pkgrepo-jwt-dev-secret
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      PORT: "5000"
    mem_limit: 200m
    restart: unless-stopped

  # ---- Package repository — Next.js frontend ----------------
  pkgrepo-frontend:
    build:
      context: >-
        ./services/package-repository/root/frontend
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
    depends_on:
      - pkgrepo-backend
    environment:
      BACKEND_URL: http://pkgrepo-backend:5000
      NEXT_BASE_PATH: /repo
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=512"
    volumes:
      - pkgrepo_node_modules:/build/services/package-repository/root/frontend/node_modules
      - pkgrepo_next:/build/services/package-repository/root/frontend/.next
    mem_limit: 700m
    restart: unless-stopped

  # ---- Nginx reverse proxy ----------------------------------
  portal:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8892:80"
    depends_on:
      - frontend
      - businessplanner-platform
      - sso
      - pkgrepo-frontend
    mem_limit: 64m
    restart: unless-stopped

volumes:
  pgdata:
  keycloak_pgdata:
  # esdata:            # commented out with elasticsearch
  redisdata:
  sso_node_modules:
  sso_next:
  pkgrepo_pgdata:
  miniodata:
  pkgrepo_node_modules:
  pkgrepo_next:
