## LaunchPad — minimal Docker Compose (8 services).
##
## Usage:
##   docker compose up --build
##   docker compose up -d
##
## App: http://localhost:8892/app/en

services:

  # ---- PostgreSQL (main app) --------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextra_db
      POSTGRES_USER: nextra
      POSTGRES_PASSWORD: nextra_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextra -d nextra_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Keycloak Postgres ------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Keycloak (OIDC identity provider) --------------------
  keycloak:
    build:
      context: ./docker/keycloak
      dockerfile: Dockerfile
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8892/sso
      KC_HTTP_RELATIVE_PATH: /sso
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_GITHUB_CLIENT_ID: ${KC_GITHUB_CLIENT_ID:-}
      KC_GITHUB_CLIENT_SECRET: ${KC_GITHUB_CLIENT_SECRET:-}
      KC_GOOGLE_CLIENT_ID: ${KC_GOOGLE_CLIENT_ID:-}
      KC_GOOGLE_CLIENT_SECRET: ${KC_GOOGLE_CLIENT_SECRET:-}
      KC_MICROSOFT_CLIENT_ID: ${KC_MICROSOFT_CLIENT_ID:-}
      KC_MICROSOFT_CLIENT_SECRET: ${KC_MICROSOFT_CLIENT_SECRET:-}
    restart: unless-stopped

  # ---- Elasticsearch (full-text search) --------------------
  elasticsearch:
    image: elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/var/lib/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis (sessions + rate-limiting) ---------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- C++ Drogon API ---------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/nextra-api.Dockerfile
      args:
        BASE_IMAGE: debian:sid
        RUNTIME_IMAGE: debian:sid-slim
        SRC_BUST: ${SRC_BUST:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: nextra_db
      DB_USER: nextra
      DB_PASSWORD: nextra_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      JWT_SECRET: change-me-in-production
      APP_BASE_URL: http://localhost:8892
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_VERSION: "0.1.0"
    restart: unless-stopped

  # ---- Next.js frontend -------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      additional_contexts:
        shared: ./shared
      args:
        SRC_BUST: ${SRC_BUST:-0}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BASE_PATH: /app
      INTERNAL_API_URL: http://backend:8080
      NEXT_BASE_PATH: /app
      BACKEND_URL: http://backend:8080
    restart: unless-stopped

  # ---- SSO portal (login gate) ------------------------------
  sso:
    build:
      context: ./services/sso/portal
      dockerfile: Dockerfile
      args:
        SRC_BUST: ${SRC_BUST:-0}
    volumes:
      - sso_node_modules:/build/sso/node_modules
      - sso_next:/build/sso/.next
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_ORIGIN: http://localhost:8892
      NODE_ENV: development
    restart: unless-stopped

  # ---- Nginx reverse proxy ----------------------------------
  portal:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8892:80"
    depends_on:
      - frontend
      - backend
      - sso
    restart: unless-stopped

volumes:
  pgdata:
  keycloak_pgdata:
  esdata:
  redisdata:
  sso_node_modules:
  sso_next:
