        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-content (private internal service) ----
  businessplanner-content:
    image: localhost:5001/johndoe6345789/businessplanner/businessplanner-content:latest
    depends_on:
      db:
