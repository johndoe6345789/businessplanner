## LaunchPad — minimal Docker Compose (8 services).
##
## Usage:
##   docker compose up --build
##   docker compose up -d
##
## App: http://localhost:8892/app/en

services:

  # ---- PostgreSQL (main app) --------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextra_db
      POSTGRES_USER: nextra
      POSTGRES_PASSWORD: nextra_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextra -d nextra_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Keycloak Postgres ------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Keycloak (OIDC identity provider) --------------------
  keycloak:
    build:
      context: ./docker/keycloak
      dockerfile: Dockerfile
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8892/sso
      KC_HTTP_RELATIVE_PATH: /sso
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_GITHUB_CLIENT_ID: ${KC_GITHUB_CLIENT_ID:-}
      KC_GITHUB_CLIENT_SECRET: ${KC_GITHUB_CLIENT_SECRET:-}
      KC_GOOGLE_CLIENT_ID: ${KC_GOOGLE_CLIENT_ID:-}
      KC_GOOGLE_CLIENT_SECRET: ${KC_GOOGLE_CLIENT_SECRET:-}
      KC_MICROSOFT_CLIENT_ID: ${KC_MICROSOFT_CLIENT_ID:-}
      KC_MICROSOFT_CLIENT_SECRET: ${KC_MICROSOFT_CLIENT_SECRET:-}
    restart: unless-stopped

  # ---- Elasticsearch (full-text search) --------------------
  elasticsearch:
    image: elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/var/lib/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis (sessions + rate-limiting) ---------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- DB migrations (runs once, then exits) ----------------
  backend-migrate:
    build:
      context: .
      dockerfile: docker/nextra-api.Dockerfile
      args:
        BASE_IMAGE: debian:sid
        RUNTIME_IMAGE: debian:sid-slim
        SRC_BUST: ${SRC_BUST:-0}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: nextra_db
      DB_USER: nextra
      DB_PASSWORD: nextra_dev
    command: ["migrate", "--up",
              "--config", "config/config.prod.json"]
    restart: "no"

  # ---- C++ Drogon API ---------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/nextra-api.Dockerfile
      args:
        BASE_IMAGE: debian:sid
        RUNTIME_IMAGE: debian:sid-slim
        SRC_BUST: ${SRC_BUST:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: nextra_db
      DB_USER: nextra
      DB_PASSWORD: nextra_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      JWT_SECRET: change-me-in-production
      APP_BASE_URL: http://localhost:8892
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_VERSION: "0.1.0"
    restart: unless-stopped

  # ---- Next.js frontend -------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      additional_contexts:
        shared: ./shared
      args:
        SRC_BUST: ${SRC_BUST:-0}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BASE_PATH: /app
      INTERNAL_API_URL: http://backend:8080
      NEXT_BASE_PATH: /app
      BACKEND_URL: http://backend:8080
    restart: unless-stopped

  # ---- SSO portal (login gate) ------------------------------
  sso:
    build:
      context: ./services/sso/portal
      dockerfile: Dockerfile
      args:
        SRC_BUST: ${SRC_BUST:-0}
    volumes:
      - sso_node_modules:/build/sso/node_modules
      - sso_next:/build/sso/.next
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_ORIGIN: http://localhost:8892
      NODE_ENV: development
    restart: unless-stopped

  # ---- Package repository — dedicated Postgres --------------
  pkgrepo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pkgrepo_db
      POSTGRES_USER: pkgrepo
      POSTGRES_PASSWORD: pkgrepo_dev
    volumes:
      - pkgrepo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U pkgrepo -d pkgrepo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- MinIO (S3-compatible blob store) ---------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f",
             "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- MinIO bucket init (runs once, then exits) ------------
  pkgrepo-mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local
        http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/packagerepo
    restart: "no"

  # ---- Package repository — C++ backend ---------------------
  pkgrepo-backend:
    build:
      context: ./services/package-repository/root
      dockerfile: backend/Dockerfile
    depends_on:
      pkgrepo-db:
        condition: service_healthy
      pkgrepo-mc:
        condition: service_completed_successfully
    environment:
      PGHOST: pkgrepo-db
      PGPORT: "5432"
      PGUSER: pkgrepo
      PGPASSWORD: pkgrepo_dev
      PGDATABASE: pkgrepo_db
      DATABASE_URL: >-
        host=pkgrepo-db port=5432
        dbname=pkgrepo_db
        user=pkgrepo password=pkgrepo_dev
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: packagerepo
      S3_ACCESS_KEY: minioadmin
      JWT_SECRET: pkgrepo-jwt-dev-secret
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      PORT: "5000"
    restart: unless-stopped

  # ---- Package repository — Next.js frontend ----------------
  pkgrepo-frontend:
    build:
      context: >-
        ./services/package-repository/root/frontend
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
    depends_on:
      - pkgrepo-backend
    environment:
      BACKEND_URL: http://pkgrepo-backend:5000
      NEXT_BASE_PATH: /repo
      NODE_ENV: development
    volumes:
      - pkgrepo_node_modules:/build/services/package-repository/root/frontend/node_modules
      - pkgrepo_next:/build/services/package-repository/root/frontend/.next
    restart: unless-stopped

  # ---- Nginx reverse proxy ----------------------------------
  portal:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8892:80"
    depends_on:
      - frontend
      - backend
      - sso
      - pkgrepo-frontend
    restart: unless-stopped

volumes:
  pgdata:
  keycloak_pgdata:
  esdata:
  redisdata:
  sso_node_modules:
  sso_next:
  pkgrepo_pgdata:
  miniodata:
  pkgrepo_node_modules:
  pkgrepo_next:
