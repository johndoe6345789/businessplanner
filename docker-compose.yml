  # ---- Next.js frontend -------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
      args:
        SRC_BUST: ${SRC_BUST:-0}
        NEXT_BASE_PATH: /app
        BACKEND_URL: http://businessplanner-platform:9012
        # Cap build heap on the 3.8 GB host (proven value
        # from hamradio/webdev prod builds); runtime is light.
        NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      - businessplanner-platform
    environment:
      NEXT_PUBLIC_BASE_PATH: /app
      INTERNAL_API_URL: http://businessplanner-platform:9012
      NEXT_BASE_PATH: /app
      BACKEND_URL: http://businessplanner-platform:9012
    mem_limit: 256m
    restart: unless-stopped

  # ---- SSO portal (login gate) ------------------------------
  sso:
    build:
      context: ./services/sso/portal
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
      args:
        SRC_BUST: ${SRC_BUST:-0}
    volumes:
      - sso_node_modules:/build/sso/node_modules
      - sso_next:/build/sso/.next
    depends_on:
      - businessplanner-platform
    environment:
      NEXT_PUBLIC_ORIGIN: http://localhost:8892
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=512"
    mem_limit: 700m
    restart: unless-stopped

