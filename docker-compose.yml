      FLASK_DEBUG: "1"
      IMAP_SYNC_INTERVAL: "300"
      SMTP_TIMEOUT: "30"
    restart: unless-stopped

  # ---- Webmail (emailclient) Next.js ------------------------
  emailclient:
    image: localhost:5001/johndoe6345789/businessplanner/emailclient:latest
    depends_on:
      emailclient-api:
        condition: service_started
      mailserver:
        condition: service_healthy
    environment:
      BACKEND_URL: http://emailclient-api:5000
      NEXT_BASE_PATH: /emailclient
      NEXT_PUBLIC_BASE_PATH: /emailclient
    restart: unless-stopped

  # ---- Alerts centre (Next.js) ------------------------------
  alerts:
    image: localhost:5001/johndoe6345789/businessplanner/alerts:latest
    depends_on:
      emailclient-api:
        condition: service_started
    environment:
      EMAIL_API_URL: http://emailclient-api:5000
      NEXT_BASE_PATH: /alerts
      NEXT_PUBLIC_BASE_PATH: /alerts
    restart: unless-stopped

  # ---- Nginx reverse proxy ----------------------------------
  portal:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8892:80"
    depends_on:
      - frontend
      - businessplanner-platform
      - sso
      - pkgrepo-frontend
      - s3-frontend
      - pgadmin-frontend
      - emailclient
      - alerts
    mem_limit: 64m
    restart: unless-stopped

