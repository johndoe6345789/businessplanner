  # ---- Mailserver (postfix + dovecot) -----------------------
  mailserver:
    image: localhost:5001/johndoe6345789/businessplanner/mailserver:latest
    hostname: mail
    domainname: businessplanner.local
    environment:
      ENABLE_CLAMAV: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_FAIL2BAN: 0
      ENABLE_POSTGREY: 0
      ENABLE_AMAVIS: 0
      SSL_TYPE: ""
      PERMIT_DOCKER: network
      ONE_DIR: 1
      OVERRIDE_HOSTNAME: mail.businessplanner.local
      POSTFIX_INET_PROTOCOLS: ipv4
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
    healthcheck:
      test: ["CMD-SHELL",
             "ss -lntp | grep ':25 ' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

