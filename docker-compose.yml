  redisdata:
  sso_node_modules:
  sso_next:
  pkgrepo_pgdata:
  s3-dbdata:
  s3-data:
  maildata:
  mailstate:
  maillogs:
  emailclient-dbdata:
  pkgrepo_node_modules:
  pkgrepo_next:
