      POSTGRES_DB: s3server
      POSTGRES_USER: s3user
      POSTGRES_PASSWORD: s3pass
    volumes:
      - s3-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U s3user -d s3server"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 140m
    restart: unless-stopped

  # ---- S3-compatible object store (in-house) ----------------
  s3:
    image: localhost:5001/johndoe6345789/businessplanner/s3:latest
    depends_on:
      s3-db:
        condition: service_healthy
    environment:
      S3_DATA_DIR: /data/s3
      S3_DB_CONN: >-
        host=s3-db port=5432
        dbname=s3server user=s3user password=s3pass
      S3_REGION: us-east-1
      S3_PORT: "9000"
      PGHOST: s3-db
      PGPORT: "5432"
      PGUSER: s3user
      PGPASSWORD: s3pass
      PGDATABASE: s3server
    volumes:
      - s3-data:/data/s3
    mem_limit: 200m
    restart: unless-stopped

