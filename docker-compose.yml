## LaunchPad — LEAN Docker Compose (right-sized for a 3.8 GB host).
##
## Lean-ship changes vs docker-compose.yml.prelean:
##  - backend + backend-migrate use the registry:2 businessplanner-api image,
##    kept CURRENT by the businessplanner-apps Jenkins pipeline (which
##    reuses the prebuilt businessplanner-base-conan layer — no host C++ compile).
##  - Elasticsearch COMMENTED OUT "for now" (user instruction + JVM mem
##    hog). Full-text search disabled until re-enabled.
##  - Login is OIDC against dbal (see `dbal` below, profile local-sso;
##    production uses the shared instance — businessplanner-deploy).
##  - Every service has a hard `mem_limit` (contains each container so a
##    spike cannot OOM-cascade the other resident stacks).
##  - Postgres shared_buffers 24MB, Redis maxmemory 48MB, Next heap 512MB.
##  - Only the nginx `portal` publishes a host port (8892).
##
## Usage:
##   docker compose up -d --build
## App: http://localhost:8892/app/en

services:

  # ---- PostgreSQL (main app) --------------------------------
  db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=24MB
      - -c
      - max_connections=100
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
    environment:
      POSTGRES_DB: businessplanner_db
      POSTGRES_USER: businessplanner
      POSTGRES_PASSWORD: businessplanner_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessplanner -d businessplanner_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    restart: unless-stopped

  # ---- Redis (sessions + rate-limiting) ---------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 90m
    restart: unless-stopped

  # ---- DB migrations (runs once, then exits) ----------------
  # Uses the registry:2 businessplanner-api image kept CURRENT by the
  # businessplanner-apps Jenkins pipeline (migrate fix af658ca + the
  # baked migration SQL come from that fresh image — no host compile).
  # Dedicated one-shot migrator (replaces the monolith
  # businessplanner-api migrate sidecar). Its entrypoint runs
  # `migrate --up` against the baked config/config.json
  # then exits — no command/env override needed.
  businessplanner-migrate:
    image: localhost:5001/businessplanner/businessplanner-migrate:latest
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  # ---- businessplanner-auth microservice (Phase 5 vertical slice) ----
  # Per-service image (BP slug). Proves the split end-to-end;
  # owns auth/users/api-keys/user-preferences routes (nginx
  # prefix routing wired during Phase 6 fan-out).
  businessplanner-auth:
    image: localhost:5001/businessplanner/businessplanner-auth:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      JWT_SECRET: change-me-in-production
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8892/api/dbal}
      OIDC_CLIENT_ID: businessplanner-app
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://dbal:8080/oidc/jwks.json}
      SSO_COOKIE_NAME: businessplanner_sso
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8892}
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-social (private internal service) ----
  businessplanner-social:
    image: localhost:5001/businessplanner/businessplanner-social:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-notifications (private internal service) ----
  businessplanner-notifications:
    image: localhost:5001/businessplanner/businessplanner-notifications:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-comments (private internal service) ----
  businessplanner-comments:
    image: localhost:5001/businessplanner/businessplanner-comments:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-analytics (private internal service) ----
  businessplanner-analytics:
    image: localhost:5001/businessplanner/businessplanner-analytics:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-gamification (private internal service) ----
  businessplanner-gamification:
    image: localhost:5001/businessplanner/businessplanner-gamification:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-content (private internal service) ----
  businessplanner-content:
    image: localhost:5001/businessplanner/businessplanner-content:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-media (private internal service) ----
  businessplanner-media:
    image: localhost:5001/businessplanner/businessplanner-media:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
      ES_HOST: elasticsearch
      ES_PORT: "9200"
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-search (private internal service) ----
  businessplanner-search:
    image: localhost:5001/businessplanner/businessplanner-search:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
      ES_HOST: elasticsearch
      ES_PORT: "9200"
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-infra (private internal service) ----
  businessplanner-infra:
    image: localhost:5001/businessplanner/businessplanner-infra:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
      ES_HOST: elasticsearch
      ES_PORT: "9200"
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-ai (private internal service) ----
  businessplanner-ai:
    image: localhost:5001/businessplanner/businessplanner-ai:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenAI-compatible server for the AI features. Default: the bundled Ollama (no real key needed; the key only has
      # to be non-empty). For a hosted provider set OPENAI_BASE_URL (and a real OPENAI_API_KEY) in the secrets file.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-model}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen2.5:3b-instruct}
      OPENAI_TIMEOUT_S: ${OPENAI_TIMEOUT_S:-180}
      # The frontend names no provider, so this picks the one that serves every AI call.
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-platform (private internal service) ----
  businessplanner-platform:
    image: localhost:5001/businessplanner/businessplanner-platform:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
      ES_HOST: elasticsearch
      ES_PORT: "9200"
    mem_limit: 96m
    restart: unless-stopped

  # ---- a self-hosted language model for the AI features (no cloud API key needed) ----
  # Ollama speaks the OpenAI API, which the AI service already supports: it is pointed here with OPENAI_BASE_URL.
  # CPU-only, so replies take tens of seconds; to use a hosted model instead, set OPENAI_BASE_URL / OPENAI_API_KEY
  # (or ANTHROPIC_API_KEY) in the secrets file and this service can be stopped.
  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve & pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull $${OPENAI_MODEL}
        wait $$pid
    environment:
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OPENAI_MODEL}\""]
      interval: 20s
      retries: 30
      start_period: 30s
    mem_limit: 6g
    cpus: 4
    restart: unless-stopped

  # ---- stand-ins for Xero and Zelt (sample data, no account needed) ----
  # The planner talks to whatever XERO_* / ZELT_* point at: these by default, the real services when credentials
  # are configured instead (see compose.prod.yml in businessplanner-deploy). Their pages say plainly they are demos.
  xero-surrogate:
    build:
      context: ./services/surrogates
    image: businessplanner-surrogates:latest
    environment:
      SURROGATE_SECRET: ${SURROGATE_SECRET:-dev-only-secret}
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-demo-xero-client}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-demo-xero-secret}
      XERO_REDIRECT_URI: ${XERO_REDIRECT_URI:-https://business.wardcrew.com/api/xero/callback}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9020/healthz', timeout=3)"]
      interval: 15s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    restart: unless-stopped

  zelt-surrogate:
    image: businessplanner-surrogates:latest
    command: ["uvicorn", "app.zelt:app", "--host", "0.0.0.0", "--port", "9021", "--no-access-log"]
    depends_on:
      - xero-surrogate
    environment:
      ZELT_DEMO_KEY: ${ZELT_DEMO_KEY:-demo-zelt-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9021/healthz', timeout=3)"]
      interval: 15s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    restart: unless-stopped

  # ---- businessplanner-signup (private internal service): self-service registration ----
  # The shared dbal has no public sign-up, only an admin-token endpoint, so this one container holds that token
  # (prod override); the planner does not. Same image as the planner, different entry point.
  businessplanner-signup:
    image: businessplanner-planner:latest
    command: ["uvicorn", "app.signup:app", "--host", "0.0.0.0", "--port", "9016", "--no-access-log"]
    depends_on:
      db:
        condition: service_healthy
      businessplanner-planner:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      DB_POOL: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9016/healthz', timeout=3)"]
      interval: 15s
      retries: 5
      start_period: 15s
    mem_limit: 96m
    restart: unless-stopped

  # ---- businessplanner-planner (private internal service): the planning tools API ----
  # KPIs, OKRs, PDCA, Hoshin, risks, decisions, feature scoping, pivots, weekly reviews, market research,
  # financial tools, accelerators, organisations, startup types, legal calculators. Python, not a C++ daemon:
  # the old C++ domains were never linked into a daemon and disagreed with the frontend's field names.
  businessplanner-planner:
    build:
      context: ./services/planner-api
    image: businessplanner-planner:latest
    depends_on:
      db:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
      businessplanner-auth:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      INTEGRATION_STATE_SECRET: ${INTEGRATION_STATE_SECRET:-dev-only-state-secret}
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-demo-xero-client}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-demo-xero-secret}
      XERO_REDIRECT_URI: ${XERO_REDIRECT_URI:-https://business.wardcrew.com/api/xero/callback}
      XERO_AUTHORIZE_URL: ${XERO_AUTHORIZE_URL:-https://business.wardcrew.com/surrogates/xero/identity/connect/authorize}
      XERO_TOKEN_URL: ${XERO_TOKEN_URL:-http://xero-surrogate:9020/identity/connect/token}
      XERO_CONNECTIONS_URL: ${XERO_CONNECTIONS_URL:-http://xero-surrogate:9020/connections}
      XERO_API_URL: ${XERO_API_URL:-http://xero-surrogate:9020}
      XERO_DEMO: ${XERO_DEMO:-1}
      ZELT_ALLOWED_BASES: ${ZELT_ALLOWED_BASES:-https://api.zelt.app,http://zelt-surrogate:9021}
      ZELT_DEFAULT_BASE_URL: ${ZELT_DEFAULT_BASE_URL:-http://zelt-surrogate:9021}
      ZELT_DEMO: ${ZELT_DEMO:-1}
      ZELT_DEMO_KEY: ${ZELT_DEMO_KEY:-demo-zelt-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9015/healthz', timeout=3)"]
      interval: 15s
      retries: 5
      start_period: 15s
    mem_limit: 128m
    restart: unless-stopped

  # ---- businessplanner-commerce (private internal service) ----
  businessplanner-commerce:
    image: localhost:5001/businessplanner/businessplanner-commerce:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      businessplanner-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: businessplanner_db
      DB_USER: businessplanner
      DB_PASSWORD: businessplanner_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HOST: businessplanner-auth
      AUTH_PORT: "9001"
      JWT_SECRET: change-me-in-production
    mem_limit: 96m
    restart: unless-stopped

  # ---- Next.js frontend -------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
      args:
        SRC_BUST: ${SRC_BUST:-0}
        NEXT_BASE_PATH: /app
        BACKEND_URL: http://businessplanner-platform:9012
        # Cap build heap on the 3.8 GB host (proven value
        # from hamradio/webdev prod builds); runtime is light.
        NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      - businessplanner-platform
    environment:
      NEXT_PUBLIC_BASE_PATH: /app
      INTERNAL_API_URL: http://businessplanner-platform:9012
      NEXT_BASE_PATH: /app
      BACKEND_URL: http://businessplanner-platform:9012
    mem_limit: 512m
    restart: unless-stopped

  # ---- SSO portal (login gate) ------------------------------
  sso:
    build:
      context: ./services/sso/portal
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
      args:
        SRC_BUST: ${SRC_BUST:-0}
    volumes:
      - sso_node_modules:/build/sso/node_modules
      - sso_next:/build/sso/.next
    depends_on:
      - businessplanner-platform
    environment:
      NEXT_PUBLIC_ORIGIN: http://localhost:8892
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8892}
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=512"
    mem_limit: 700m
    restart: unless-stopped

  # ---- Package repository — dedicated Postgres --------------
  pkgrepo-db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
    environment:
      POSTGRES_DB: pkgrepo_db
      POSTGRES_USER: pkgrepo
      POSTGRES_PASSWORD: pkgrepo_dev
    volumes:
      - pkgrepo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U pkgrepo -d pkgrepo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 140m
    restart: unless-stopped

  # ---- S3 server — dedicated Postgres -----------------------
  s3-db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
    environment:
      POSTGRES_DB: s3server
      POSTGRES_USER: s3user
      POSTGRES_PASSWORD: s3pass
    volumes:
      - s3-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U s3user -d s3server"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 140m
    restart: unless-stopped

  # ---- S3-compatible object store (in-house) ----------------
  s3:
    image: localhost:5001/businessplanner/s3:latest
    depends_on:
      s3-db:
        condition: service_healthy
    environment:
      S3_DATA_DIR: /data/s3
      S3_DB_CONN: >-
        host=s3-db port=5432
        dbname=s3server user=s3user password=s3pass
      S3_REGION: us-east-1
      S3_PORT: "9000"
      PGHOST: s3-db
      PGPORT: "5432"
      PGUSER: s3user
      PGPASSWORD: s3pass
      PGDATABASE: s3server
    volumes:
      - s3-data:/data/s3
    # Receives blobs up to setClientMaxBodySize (2 GB) into a single
    # in-memory request buffer, so the cap must clear 2 GB + overhead.
    mem_limit: 2800m
    restart: unless-stopped

  # ---- Package repository — C++ backend ---------------------
  pkgrepo-backend:
    image: localhost:5001/businessplanner/packagerepo-backend:latest
    ports:
      # :5001 is the jenkins CI registry (registry:2). The package repository
      # serves on :5002 so the two no longer collide on the host.
      - "5002:5000"
    depends_on:
      pkgrepo-db:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      PGHOST: pkgrepo-db
      PGPORT: "5432"
      PGUSER: pkgrepo
      PGPASSWORD: pkgrepo_dev
      PGDATABASE: pkgrepo_db
      DATABASE_URL: >-
        host=pkgrepo-db port=5432
        dbname=pkgrepo_db
        user=pkgrepo password=pkgrepo_dev
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: packagerepo
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: pkgrepo-jwt-dev-secret
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      PORT: "5000"
    # Committing a blob holds it twice: the finalize() read buffer plus
    # trantor's outbound S3 PUT send buffer. Needs ~2x the 2 GB max body.
    mem_limit: 4500m
    restart: unless-stopped

  # ---- Package repository — Next.js frontend ----------------
  pkgrepo-frontend:
    image: localhost:5001/businessplanner/packagerepo-frontend:latest
    depends_on:
      - pkgrepo-backend
    environment:
      BACKEND_URL: http://pkgrepo-backend:5000
      NEXT_BASE_PATH: /repo
      NEXT_PUBLIC_BASE_PATH: /repo
    mem_limit: 512m
    restart: unless-stopped

  # ---- S3 server frontend (Next.js) -------------------------
  s3-frontend:
    image: localhost:5001/businessplanner/s3-frontend:latest
    depends_on:
      - s3
    environment:
      BACKEND_URL: http://s3:9000
      NEXT_BASE_PATH: /s3
      NEXT_PUBLIC_BASE_PATH: /s3
    restart: unless-stopped

  # ---- PgAdmin backend (Drogon C++ DB browser) --------------
  pgadmin-backend:
    image: localhost:5001/businessplanner/pgadmin-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_CONN: >-
        host=db port=5432
        dbname=businessplanner_db
        user=businessplanner password=businessplanner_dev
      PG_PORT: "5060"
      JWT_SECRET: dev-secret-change-in-production
      PGHOST: db
      PGPORT: "5432"
      PGUSER: businessplanner
      PGPASSWORD: businessplanner_dev
      PGDATABASE: businessplanner_db
    restart: unless-stopped

  # ---- PgAdmin frontend (Next.js) ---------------------------
  pgadmin-frontend:
    image: localhost:5001/businessplanner/pgadmin-frontend:latest
    depends_on:
      - pgadmin-backend
    environment:
      BACKEND_URL: http://pgadmin-backend:5060
      NEXT_BASE_PATH: /db
      NEXT_PUBLIC_BASE_PATH: /db
    restart: unless-stopped

  # ---- Mailserver (postfix + dovecot) -----------------------
  mailserver:
    image: localhost:5001/businessplanner/mailserver:latest
    hostname: mail
    domainname: businessplanner.local
    environment:
      ENABLE_CLAMAV: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_FAIL2BAN: 0
      ENABLE_POSTGREY: 0
      ENABLE_AMAVIS: 0
      SSL_TYPE: ""
      PERMIT_DOCKER: network
      ONE_DIR: 1
      OVERRIDE_HOSTNAME: mail.businessplanner.local
      POSTFIX_INET_PROTOCOLS: ipv4
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
    healthcheck:
      test: ["CMD-SHELL",
             "ss -lntp | grep ':25 ' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---- Email client Postgres --------------------------------
  emailclient-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emailclient
      POSTGRES_USER: emailclient
      POSTGRES_PASSWORD: emailclient
    volumes:
      - emailclient-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U emailclient -d emailclient"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Email client API (Flask) -----------------------------
  emailclient-api:
    image: localhost:5001/businessplanner/emailclient-api:latest
    depends_on:
      mailserver:
        condition: service_healthy
      emailclient-db:
        condition: service_healthy
    environment:
      POSTFIX_HOST: mailserver
      POSTFIX_PORT: "25"
      DOVECOT_HOST: mailserver
      DOVECOT_IMAP_PORT: "143"
      SMTP_HOST: mailserver
      SMTP_PORT: "587"
      DATABASE_URL: >-
        postgresql://emailclient:emailclient@emailclient-db:5432/emailclient
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      IMAP_SYNC_INTERVAL: "300"
      SMTP_TIMEOUT: "30"
    restart: unless-stopped

  # ---- Webmail (emailclient) Next.js ------------------------
  emailclient:
    image: localhost:5001/businessplanner/emailclient:latest
    depends_on:
      emailclient-api:
        condition: service_started
      mailserver:
        condition: service_healthy
    environment:
      BACKEND_URL: http://emailclient-api:5000
      NEXT_BASE_PATH: /emailclient
      NEXT_PUBLIC_BASE_PATH: /emailclient
    restart: unless-stopped

  # ---- Alerts centre (Next.js) ------------------------------
  alerts:
    image: localhost:5001/businessplanner/alerts:latest
    depends_on:
      emailclient-api:
        condition: service_started
    environment:
      EMAIL_API_URL: http://emailclient-api:5000
      NEXT_BASE_PATH: /alerts
      NEXT_PUBLIC_BASE_PATH: /alerts
    restart: unless-stopped

  # ---- Nginx reverse proxy ----------------------------------
  # ---- dbal: local OIDC provider (docker compose --profile local-sso) ----
  # SQLite, the stock demo users (<username>-Demo1!), and a client list that
  # allows http://localhost:8892. Production uses the shared dbal instead.
  dbal:
    profiles: ["local-sso"]
    image: ghcr.io/johndoe6345789/dbal:latest
    environment:
      DBAL_ADAPTER: sqlite
      DATABASE_URL: /app/data/dbal.sqlite
      DBAL_AUTO_CREATE_TABLES: "true"
      DBAL_SEED_ON_STARTUP: "true"
      DBAL_SEED_DIR: /app/seeds/database
      DBAL_OIDC_ISSUER: http://localhost:8892/api/dbal
      DBAL_PUBLIC_PATH_PREFIX: /api/dbal
      DBAL_OIDC_CLIENTS_CONFIG: /app/schemas/oidc/clients.json
      DBAL_OIDC_PRIVATE_KEY_PATH: /app/keys/oidc_signing_key.pem
      JWT_SECRET_KEY: dev-only-change-me
      DBAL_ADMIN_TOKEN: dev-only-change-me
    volumes:
      - ./docker/dbal/clients.json:/app/schemas/oidc/clients.json:ro
      - dbal_data:/app/data
      - dbal_keys:/app/keys
    mem_limit: 128m
    restart: unless-stopped

  portal:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8892:80"
    depends_on:
      - frontend
      - businessplanner-platform
      - sso
      - pkgrepo-frontend
      - s3-frontend
      - pgadmin-frontend
      - emailclient
      - alerts
    mem_limit: 64m
    restart: unless-stopped

volumes:
  ollama_models:
    name: bp-ollama-models
  pgdata:
  dbal_data:
  dbal_keys:
  # esdata:            # commented out with elasticsearch
  redisdata:
  sso_node_modules:
  sso_next:
  pkgrepo_pgdata:
  s3-dbdata:
  s3-data:
  maildata:
  mailstate:
  maillogs:
  emailclient-dbdata:
  pkgrepo_node_modules:
  pkgrepo_next:

networks:
  default:
    external: true
    name: businessplanner_default
